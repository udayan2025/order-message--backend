services:
  - type: web
    name: messageapi-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: 768
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: SESSION_AUTH_DIR
        value: /var/data/whatsapp_auth_sessions
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CLIENT_URL
        sync: false
    disk:
      name: whatsapp-sessions-data
      mountPath: /var/data
      sizeGB: 1
